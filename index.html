<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculatrice">
            <div class="ecran" id="ecran">0</div>
            <button id="effacer">Effacer</button> <br>
            <div class="chiffre_operation">
                <button>0</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button> 
                <button>9</button>
                <button>+</button>
                <button>-</button>
                <button>*</button>
                <button>/</button>
                <button>.</button>
                <button>=</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
